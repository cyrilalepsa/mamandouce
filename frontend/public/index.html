        <style>
            @keyframes pulse {
                0%, 100% { opacity: 0.4; transform: scale(1); }
                50% { opacity: 1; transform: scale(1.2); }
            }
            /* Cacher TOUTES les bannières Emergent - version ultra-agressive */
            [class*="wake"], [class*="spinning"], [class*="preview-banner"],
            [class*="Wake"], [class*="Spinning"], [class*="Preview"],
            [class*="emergent"], [class*="Emergent"],

            /* Cacher les toasts/pills en position fixed en bas */
            div[style*="fixed"][style*="z-index"]:not(#initial-loader):not(#root):not(.App) {

                visibility: hidden !important;
                opacity: 0 !important;
                pointer-events: none !important;

                width: 0 !important;

        </style>
        
        <script>
            // Cacher le loader initial quand React est prêt
            window.hideInitialLoader = function() {
                var loader = document.getElementById('initial-loader');
                if (loader) {
                    loader.style.transition = 'opacity 0.3s';
                    loader.style.opacity = '0';
                    setTimeout(function() { loader.style.display = 'none'; }, 300);
                }
            };
            // Timeout de secours - cacher après 5 secondes max
            setTimeout(window.hideInitialLoader, 5000);
            
            // Script ultra-agressif pour cacher TOUTES les bannières Emergent
            (function hideEmergentBanner() {
                var keywords = ['spinning', 'wake up', 'waking', 'made with emergent', 'servers', 'starting'];
                
                function shouldHide(el) {
                    if (!el || el.id === 'initial-loader' || el.id === 'root' || el.id === 'emergent-badge') return false;
                    if (el.tagName === 'HTML' || el.tagName === 'BODY') return false;
                    
                    var text = (el.innerText || el.textContent || '').toLowerCase();
                    var style = (el.getAttribute('style') || '').toLowerCase();
                    
                    // Vérifier le texte
                    for (var i = 0; i < keywords.length; i++) {
                        if (text.includes(keywords[i])) return true;
                    }
                    
                    // Vérifier les éléments fixed en bas (sauf nos éléments)
                    if (style.includes('fixed') && style.includes('bottom') && !el.closest('#root')) {
                        return true;
                    }
                    
                    return false;
                }
                
                function hideElement(el) {
                    el.style.cssText = 'display:none!important;visibility:hidden!important;opacity:0!important;height:0!important;width:0!important;overflow:hidden!important;pointer-events:none!important;position:absolute!important;top:-9999px!important;left:-9999px!important;';
                    el.setAttribute('aria-hidden', 'true');
                }
                
                function hide() {
                    // Parcourir tous les éléments
                    document.querySelectorAll('div, span, p, section, aside, footer').forEach(function(el) {
                        if (shouldHide(el)) {
                            hideElement(el);
                        }
                    });
                    
                    // Cacher spécifiquement les iframes ou scripts Emergent
                    document.querySelectorAll('iframe[src*="emergent"], script[src*="emergent"]').forEach(function(el) {
                        if (el.id !== 'emergent-badge') {
                            el.style.display = 'none';
                        }
                    });
                }
                
                // Exécuter immédiatement
                hide();
                
                // Exécuter périodiquement (toutes les 200ms pendant 10 secondes, puis toutes les 2 secondes)
                var count = 0;
                var fastInterval = setInterval(function() {
                    hide();
                    count++;
                    if (count > 50) {
                        clearInterval(fastInterval);
                        setInterval(hide, 2000);
                    }
                }, 200);
                
                // Observer les mutations DOM
                if (typeof MutationObserver !== 'undefined') {
                    var observer = new MutationObserver(function(mutations) {
                        mutations.forEach(function(mutation) {
                            mutation.addedNodes.forEach(function(node) {
                                if (node.nodeType === 1 && shouldHide(node)) {
                                    hideElement(node);
                                }
                            });
                        });
                        hide();
                    });
                    
                    if (document.body) {
                        observer.observe(document.body, { childList: true, subtree: true });
                    } else {
                        document.addEventListener('DOMContentLoaded', function() {
                            observer.observe(document.body, { childList: true, subtree: true });
                        });
                    }
                }
            })();
        </script>
