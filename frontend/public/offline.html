<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MamanDouce - Hors ligne</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce7f3 0%, #f0f9ff 50%, #f5f3ff 100%);
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px;
    }
    
    .container {
      text-align: center;
      max-width: 400px;
    }
    
    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 40px rgba(236, 72, 153, 0.3);
    }
    
    .icon svg {
      width: 60px;
      height: 60px;
      color: white;
    }
    
    h1 {
      font-size: 28px;
      color: #334155;
      margin-bottom: 12px;
    }
    
    p {
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .tips {
      background: white;
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    
    .tips h3 {
      color: #ec4899;
      font-size: 14px;
      margin-bottom: 12px;
    }
    
    .tips ul {
      list-style: none;
    }
    
    .tips li {
      padding: 8px 0;
      color: #475569;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tips li::before {
      content: "✨";
    }
    
    button {
      margin-top: 24px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      color: white;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
      </svg>
    </div>
    
    <h1>Vous êtes hors ligne</h1>
    <p>Pas de panique ! Certaines fonctionnalités sont disponibles même sans connexion.</p>
    
    <div class="tips">
      <h3>En mode hors ligne, vous pouvez :</h3>
      <ul>
        <li>Consulter les conseils déjà chargés</li>
        <li>Voir votre liste de naissance</li>
        <li>Accéder à vos favoris</li>
        <li>Consulter vos rendez-vous</li>
      </ul>
    </div>
    
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
