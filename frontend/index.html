        <script>
          window.addEventListener('error', function(e) {
            var splash = document.getElementById('initial-loader')
              || document.getElementById('initial-splash')
              || document.getElementById('pwa-splash');
            if (splash) {
              splash.innerHTML = '<div style="color:#334155;padding:20px;text-align:center;font-family:sans-serif;">Erreur au démarrage: '
                + (e.message || 'Problème de chargement') + '</div>';
            }
          });
          setTimeout(function() {
            var splash = document.getElementById('initial-loader')
              || document.getElementById('initial-splash')
              || document.getElementById('pwa-splash');
            if (splash && splash.style.display !== 'none') {
              console.warn('Boot timeout - Forcing splash removal');
              splash.style.display = 'none';
            }
          }, 10000);
          window.hideInitialLoader = function() {
            var splash = document.getElementById('initial-loader')
              || document.getElementById('initial-splash')
              || document.getElementById('pwa-splash');
            if (splash) {
              splash.style.display = 'none';
            }
          };
        </script>

        <!-- App Version for cache busting -->
        <script>
            window.APP_VERSION = '2.6.0-safeboot';
            (function() {
                try {
                    var lastVersion = localStorage.getItem('app_version');
                    if (lastVersion !== window.APP_VERSION) {
                        localStorage.setItem('app_version', window.APP_VERSION);
                        if (lastVersion) {
                            window.location.reload();
                        }
                    }
                } catch (err) {
                    console.warn('localStorage indisponible (navigation privée)', err);
                }
            })();
